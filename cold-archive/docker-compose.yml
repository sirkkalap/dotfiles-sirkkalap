services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      # Projekti mountataan read-only lähteeksi; buildissä synkataan workspaceen (välttää UID/GID-oikeusongelmat)
      - ./:/src:ro
    working_dir: /var/jenkins_home

volumes:
  jenkins_home:
